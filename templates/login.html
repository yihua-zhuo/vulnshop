{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
  <h1>Login</h1>
  <p class="muted">Sign in to manage your account and saved catalog views.</p>

  <form method="POST">
    <p><label>Username <input name="username" autofocus></label></p>
    <p><label>Password <input name="password" type="password"></label></p>
    <button type="submit">Sign in</button>
  </form>

  <p>No account? <a href="{{ url_for('register') }}">Register</a></p>
{% endblock %}
