{% extends "base.html" %}
{% block title %}Catalog{% endblock %}
{% block content %}
  <h1>Catalog</h1>
  <p class="muted">Welcome to Everyday Shop. Browse products or
    <a href="{{ url_for('search') }}">search</a> the catalog.</p>

  {% for p in products %}
    <div class="card">
      <h3><a href="{{ url_for('product', pid=p.id) }}">{{ p.name }}</a> — ${{ p.price }}</h3>
      <p>{{ p.description }}</p>
    </div>
  {% endfor %}
{% endblock %}
