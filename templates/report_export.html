{% extends "base.html" %}
{% block title %}Export #{{ job.id }}{% endblock %}
{% block content %}
<h1>Export #{{ job.id }}</h1>
<p>Status: {{ job.state }} · Source report: {{ job.report_id }}</p>
{% if job.state == 'queued' %}
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ shopping_csrf() }}">
  <label>Source <select name="report_id">{% for report in owned %}<option value="{{ report.id }}" {% if report.id == job.report_id %}selected{% endif %}>{{ report.title }}</option>{% endfor %}</select></label>
  <button name="action" value="configure">Update source</button>
</form>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ shopping_csrf() }}">
  <button name="action" value="run">Process export</button>
</form>
{% else %}<pre style="white-space:pre-wrap">{{ job.output }}</pre>{% endif %}
<p><a href="{{ url_for('reports.index') }}">Back to reports</a></p>
{% endblock %}
